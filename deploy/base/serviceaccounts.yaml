# One identity per workload. No tokens mounted; nothing here talks to the Kubernetes API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hydra-web
  labels:
    app.kubernetes.io/part-of: hydra
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: colby-api
  labels:
    app.kubernetes.io/part-of: hydra
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hydra-db
  labels:
    app.kubernetes.io/part-of: hydra
automountServiceAccountToken: false
