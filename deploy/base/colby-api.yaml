# Colby API (mock in-house ancillary service).
# ClusterIP only: reachable from inside the cluster, never from the load balancer.
apiVersion: v1
kind: Service
metadata:
  name: colby-api
  labels:
    app.kubernetes.io/name: colby-api
    app.kubernetes.io/part-of: hydra
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: colby-api
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: colby-api
  labels:
    app.kubernetes.io/name: colby-api
    app.kubernetes.io/part-of: hydra
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: colby-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: colby-api
        app.kubernetes.io/part-of: hydra
    spec:
      serviceAccountName: colby-api
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: colby-api
          image: ghcr.io/mikestizza/colby-api:main
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
# Only hydra-web pods in this namespace may talk to colby-api.
# A pod in any other namespace (or an unlabeled pod here) is denied.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: colby-api-ingress
  labels:
    app.kubernetes.io/part-of: hydra
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: colby-api
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: hydra-web
      ports:
        - protocol: TCP
          port: 8080
