# Ephemeral environment for branch 'feature/member-alerts'. Generated by CI.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hydra-feature-member-alerts
  labels:
    app.kubernetes.io/part-of: hydra
    hydra.ccu/env: feature-member-alerts
    hydra.ccu/ephemeral: "true"
spec:
  interval: 1m
  retryInterval: 30s
  timeout: 5m
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: hydra-lite
  path: ./deploy/envs/feature-member-alerts
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: hydra-cluster-vars
      - kind: Secret
        name: hydra-secrets
