# Ephemeral environment for branch 'feature/member-alerts'. Generated by CI; removed when the branch is deleted.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hydra-feature-member-alerts
resources:
  - ../../base
images:
  - name: ghcr.io/mikestizza/hydra-web
    newTag: feature-member-alerts-168e16a
  - name: ghcr.io/mikestizza/colby-api
    newTag: feature-member-alerts-168e16a
configMapGenerator:
  - name: hydra-config
    behavior: merge
    literals:
      - Hydra__Environment=feature-member-alerts
      - "Hydra__Banner=Ephemeral environment for branch 'feature/member-alerts' (feature-member-alerts-168e16a). Deleted when the branch is."
      - "Hydra__Accent=#7a2e8e"
patches:
  - target:
      kind: Ingress
      name: hydra-web
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: hydra-feature-member-alerts.${INGRESS_DOMAIN}
      - op: replace
        path: /spec/tls/0/hosts/0
        value: hydra-feature-member-alerts.${INGRESS_DOMAIN}
  - target:
      kind: StatefulSet
      name: hydra-db
    patch: |-
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 5Gi
