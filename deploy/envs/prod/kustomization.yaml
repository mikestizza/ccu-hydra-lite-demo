# Production overlay. CI updates the image tags below on every merge to main.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hydra
resources:
  - ../../base
images:
  - name: ghcr.io/mikestizza/hydra-web
    newTag: main-9d54d7f
  - name: ghcr.io/mikestizza/colby-api
    newTag: main-9d54d7f
configMapGenerator:
  - name: hydra-config
    behavior: merge
    literals:
      - Hydra__Environment=Production
      - "Hydra__Banner=Scheduled maintenance: online banking sync paused Sat 10 PM to midnight PT"
      - "Hydra__Accent=#0f2a5a"
