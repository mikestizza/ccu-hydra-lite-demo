# Layer 9b: a second ConstraintTemplate. Images must be pinned: no :latest, no untagged.
# Why: a patch should be a deliberate tag change in Git, never a surprise pull.
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: hydradisallowlatest
spec:
  crd:
    spec:
      names:
        kind: HydraDisallowLatest                # new kind created by this template
  targets:
    - target: admission.k8s.gatekeeper.sh        # checked on every create/update
      rego: |
        package hydradisallowlatest

        # Containers from a workload's pod template...
        containers[c] {
          c := input.review.object.spec.template.spec.containers[_]
        }
        # ...or from a bare Pod.
        containers[c] {
          c := input.review.object.spec.containers[_]
        }

        # Violation: image ends in :latest.
        violation[{"msg": msg}] {
          c := containers[_]
          endswith(c.image, ":latest")
          msg := sprintf("Policy: container <%v> uses image <%v>; the :latest tag is not allowed (Hydra platform standard)", [c.name, c.image])
        }

        # Violation: image has no tag and no digest at all (which also means latest).
        violation[{"msg": msg}] {
          c := containers[_]
          not contains(c.image, ":")
          not contains(c.image, "@")
          msg := sprintf("Policy: container <%v> uses untagged image <%v>; pin a tag or digest (Hydra platform standard)", [c.name, c.image])
        }
