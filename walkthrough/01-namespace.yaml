# Layer 1: the namespace. The boundary that quotas, RBAC, network policy
# and admission policy all scope to.
apiVersion: v1                                   # core API group, v1 (namespaces are as old as Kubernetes)
kind: Namespace                                  # the object type
metadata:
  name: hydra                                    # the name every other object in this walkthrough lives under
  labels:
    app.kubernetes.io/part-of: hydra             # standard label: lets you select everything Hydra-related
    hydra.ccu/managed: "true"                    # our own label: Gatekeeper constraints (layer 9) target namespaces with this
    pod-security.kubernetes.io/enforce: baseline # built-in Pod Security Admission: reject privileged pods, host network, host paths
